<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes scanLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-purple { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillRev 6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillRev 6.5s ease-in-out infinite 1.5s; }
    .scan-beam { animation: scanLine 8s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Dynamic Ambient Orbs in Background -->
  <circle class="orb-cyan" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#orbGlow)" />
  <circle class="orb-purple" cx="1020" cy="310" r="160" fill="#6366f1" filter="url(#orbGlow)" />
  <circle class="orb-cyan" cx="880" cy="70" r="100" fill="#38bdf8" filter="url(#orbGlow)" opacity="0.3" />

  <!-- Tech Grid Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
  </g>

  <!-- Animated Horizon Scanning Beam -->
  <rect class="scan-beam" y="0" width="300" height="420" fill="url(#accentCyan)" opacity="0.04" />

  <!-- Animated Feature Badges / Pills (Placed behind foreground text) -->
  <g class="pill-1" transform="translate(80, 50)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="90" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ SaaS Marketplaces</text>
  </g>

  <g class="pill-2" transform="translate(940, 60)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="90" y="22" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Open-Source Catalogs</text>
  </g>

  <g class="pill-3" transform="translate(90, 340)">
    <rect width="200" height="34" rx="17" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <text x="100" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 Internal App Distribution</text>
  </g>

  <g class="pill-4" transform="translate(920, 335)">
    <rect width="200" height="34" rx="17" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="100" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Developer Ecosystems</text>
  </g>

  <!-- FOREGROUND: High Contrast Title & Header Texts -->
  <!-- Category Tag -->
  <g transform="translate(600, 115)">
    <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="4" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE SOFTWARE DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#glow)">
    Awesome Enterprise App Store
  </text>
  
  <text x="600" y="245" fill="url(#accentCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle">
    &amp; Ecosystem Hub
  </text>

  <!-- Subtitle -->
  <text x="600" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Curated SaaS Marketplaces • Self-Hosted App Stores • Developer Extension Portals
  </text>

  <!-- Border Accent -->
  <rect x="0" y="0" width="1200" height="420" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentCyan)" />
</svg>
